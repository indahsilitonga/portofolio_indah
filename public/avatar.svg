<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Light Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c67ed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="innerShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c67ed" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2c67ed" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with Clean Soft Accent -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradient)" stroke="#2c67ed" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#2c67ed" stroke-width="1.5" opacity="0.3"/>
  <circle cx="250" cy="250" r="195" fill="url(#accentGlow)" opacity="0.8"/>

  <!-- Tech Floating Badges in Background Orbit -->
  <g opacity="0.95">
    <!-- QA Checkmark Badge -->
    <circle cx="390" cy="130" r="28" fill="#ffffff" stroke="#2c67ed" stroke-width="2.5" filter="url(#glowEffect)"/>
    <path d="M378 130 L386 138 L402 122" fill="none" stroke="#2c67ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Code Bracket Badge -->
    <circle cx="110" cy="140" r="28" fill="#ffffff" stroke="#2c67ed" stroke-width="2.5" filter="url(#glowEffect)"/>
    <text x="110" y="147" fill="#2c67ed" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <!-- Bug Testing Badge -->
    <circle cx="410" cy="310" r="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M402 305 Q410 295 418 305 Q418 318 410 322 Q402 318 402 305 Z" fill="#2c67ed"/>
    <line x1="396" y1="310" x2="424" y2="310" stroke="#93c5fd" stroke-width="2"/>
    <line x1="397" y1="316" x2="423" y2="316" stroke="#93c5fd" stroke-width="2"/>

    <!-- Del Tech Badge -->
    <circle cx="95" cy="300" r="24" fill="#ffffff" stroke="#2c67ed" stroke-width="2"/>
    <text x="95" y="306" fill="#2c67ed" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DEL</text>
  </g>

  <!-- Hair Back -->
  <path d="M160 210 C150 280 150 340 180 390 C190 320 200 240 200 210 Z" fill="url(#hairGrad)"/>
  <path d="M340 210 C350 280 350 340 320 390 C310 320 300 240 300 210 Z" fill="url(#hairGrad)"/>

  <!-- Body / Blazer (Navy Tech Professional Look) -->
  <path d="M140 450 C140 380 180 350 250 350 C320 350 360 380 360 450 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Inner Tech Shirt / Royal Blue Accent -->
  <polygon points="250,350 220,430 280,430" fill="url(#innerShirt)"/>
  
  <!-- Collar & Lapels -->
  <path d="M210 350 L250 420 L220 450 L170 380 Z" fill="#1e293b" stroke="#2c67ed" stroke-width="1.5"/>
  <path d="M290 350 L250 420 L280 450 L330 380 Z" fill="#1e293b" stroke="#2c67ed" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M225 280 L225 355 C235 365 265 365 275 355 L275 280 Z" fill="#e2a06c"/>

  <!-- Head / Face -->
  <ellipse cx="250" cy="235" rx="65" ry="78" fill="#f5b888"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="225" cy="230" rx="6" ry="7" fill="#1e293b"/>
  <circle cx="227" cy="228" r="2" fill="#ffffff"/>
  <path d="M212 218 Q225 212 238 217" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <ellipse cx="275" cy="230" rx="6" ry="7" fill="#1e293b"/>
  <circle cx="277" cy="228" r="2" fill="#ffffff"/>
  <path d="M262 217 Q275 212 288 218" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Modern Glasses -->
  <rect x="205" y="215" width="38" height="28" rx="7" fill="none" stroke="#2c67ed" stroke-width="3"/>
  <rect x="257" y="215" width="38" height="28" rx="7" fill="none" stroke="#2c67ed" stroke-width="3"/>
  <line x1="243" y1="228" x2="257" y2="228" stroke="#2c67ed" stroke-width="3"/>
  <path d="M205 224 L190 220" stroke="#2c67ed" stroke-width="2.5"/>
  <path d="M295 224 L310 220" stroke="#2c67ed" stroke-width="2.5"/>

  <!-- Nose -->
  <path d="M248 240 Q252 252 248 256" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Friendly Smile -->
  <path d="M236 270 Q250 282 264 270" stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Hair Style -->
  <path d="M185 220 C180 150 210 125 250 125 C290 125 320 150 315 220 C300 170 270 160 250 160 C230 160 200 170 185 220 Z" fill="url(#hairGrad)"/>
  <path d="M200 165 Q230 155 255 175 Q235 200 200 195 Z" fill="#334155" opacity="0.6"/>

  <!-- Tech Lanyard / SQA Badge Pin -->
  <circle cx="218" cy="405" r="9" fill="#2c67ed"/>
  <path d="M214 405 L217 408 L223 402" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Floating QA Verified Chip (Clean Light Style) -->
  <g transform="translate(145, 435)">
    <rect x="0" y="0" width="210" height="42" rx="21" fill="#ffffff" stroke="#2c67ed" stroke-width="2" filter="url(#glowEffect)"/>
    <circle cx="24" cy="21" r="10" fill="#2c67ed"/>
    <path d="M20 21 L23 24 L29 18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="26" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">QA Verified Engineer</text>
  </g>
</svg>
